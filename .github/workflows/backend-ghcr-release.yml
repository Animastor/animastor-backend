# Backend GHCR release (Stage 41; publish fix Stage 43) — build + isolated
# smoke + publish.
#
# Restores the missing backend half of the image pipeline: the gpu-hub repo has
# ghcr-release.yml, but this repository had NO workflow until stage 41, so
# backend images were only ever built by hand (deploy-<sha> tags). Stage 41
# proved GITHUB_TOKEN cannot write to the pre-existing org package
# animastor/animastor-backend (denied: permission_denied: write_package — the
# package was created by manual pushes, not by Actions). Stage 43 fix, matching
# the working gpu-hub pattern: publish via the repo secret GHCR_IMAGE_PAT
# (classic PAT, scopes repo + write:packages), falling back to GITHUB_TOKEN if
# the secret is absent (e.g. after the owner later grants the package
# Actions-read/write to this repository and removes the secret).
#
# RULES
#   - workflow_dispatch ONLY (no push trigger): a publish run must always be an
#     explicit, operator-chosen immutable commit + tag pair — pushing the
#     workflow file itself never builds or publishes anything.
#   - The backend/ source tree of the built commit must be byte-identical to
#     APPROVED_COMMIT (the approved backend source pin). The run FAILS if the
#     checked-out HEAD does not equal the requested commit or if backend/
#     differs from the approved tree.
#   - Never publish :latest and NEVER overwrite an existing tag: the push step
#     refuses to run if either target tag already exists in the registry.
#     Tags are deploy-<short-sha> and the full SHA.
#   - Smoke runs against an isolated docker network with an ephemeral redis —
#     no production PostgreSQL/Redis is reachable from the smoke containers.
#   - The image content is compared byte-for-byte (sha256) against the
#     checked-out source before anything is pushed.
#
# NOTE: build context is ./backend (backend/Dockerfile). This repository has no
# backend/.dockerignore (the monorepo has one) — the context therefore carries
# the tracked tests/ tree; production bind-mounts shadow /app/tests at runtime.

name: backend-ghcr-release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Immutable source commit to build (must carry the approved backend/ tree)"
        required: true
        type: string
      image_tag:
        description: "Immutable image tag, e.g. deploy-<short-sha> (must NOT already exist)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: animastor/animastor-backend
  APPROVED_COMMIT: 18b4f4b06a59168f02fcdabf30f144bc32cabf48

jobs:
  build-smoke-push:
    name: build + isolated smoke + push to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || env.APPROVED_COMMIT }}
          # depth must reach APPROVED_COMMIT from the requested commit for the
          # backend/-tree equality gate below (stage 43)
          fetch-depth: 10

      - name: Verify source commit (fail-closed)
        id: src
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          WANT="${{ inputs.commit || env.APPROVED_COMMIT }}"
          TAG="${{ inputs.image_tag }}"
          echo "checked-out HEAD: $HEAD_SHA"
          echo "requested commit: $WANT"
          if [ "$HEAD_SHA" != "$WANT" ]; then
            echo "PROVENANCE FAIL: checkout is not the requested commit" >&2
            exit 1
          fi
          # the built backend/ tree must equal the approved backend source
          git cat-file -e "${APPROVED_COMMIT}^{commit}" \
            || { echo "PROVENANCE FAIL: approved commit ${APPROVED_COMMIT} not in fetched history" >&2; exit 1; }
          if ! git diff --quiet "${APPROVED_COMMIT}" HEAD -- backend/; then
            echo "PROVENANCE FAIL: backend/ tree differs from approved commit ${APPROVED_COMMIT}" >&2
            exit 1
          fi
          echo "backend/ tree == approved ${APPROVED_COMMIT}"
          echo "commit=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build image (context ./backend, no build args, no secrets)
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=${{ steps.src.outputs.commit }}" \
            --label "org.opencontainers.image.source=https://github.com/Animastor/animastor-backend" \
            --label "org.opencontainers.image.version=${{ steps.src.outputs.tag }}" \
            -t "${REGISTRY}/${IMAGE_NAME}:${{ steps.src.outputs.tag }}" \
            -t "${REGISTRY}/${IMAGE_NAME}:${{ steps.src.outputs.commit }}" \
            ./backend

      - name: Isolated smoke (ephemeral redis, no production PG/Redis)
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}:${{ steps.src.outputs.tag }}"

          # 1) image content must equal the checked-out source (byte-for-byte)
          for f in src/backend.cjs package.json package-lock.json Dockerfile; do
            img_sha=$(docker run --rm --entrypoint sha256sum "$IMG" "/app/$f" | cut -d' ' -f1)
            src_sha=$(sha256sum "backend/$f" | cut -d' ' -f1)
            echo "$f  image=$img_sha  source=$src_sha"
            [ "$img_sha" = "$src_sha" ] || { echo "PROVENANCE FAIL: $f" >&2; exit 1; }
          done

          # 2) OCI label must carry the approved revision
          rev=$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMG")
          [ "$rev" = "${{ steps.src.outputs.commit }}" ] || { echo "PROVENANCE FAIL: label $rev" >&2; exit 1; }

          # 3) boot in an isolated network (backend hardcodes redis host 'redis')
          docker network create be-smoke >/dev/null
          docker run -d --name redis --network be-smoke redis:7 >/dev/null
          sleep 5
          docker run -d --name backend --network be-smoke \
            -e PG_HOST=127.0.0.1 -e PG_PORT=5432 \
            -e OUTPUT_DIR=/tmp/out -e BOOKS_DIR=/tmp/books \
            "$IMG" >/dev/null

          CODE=0
          BODY=""
          for i in $(seq 1 30); do
            BODY=$(docker exec backend node -e "require('http').get('http://127.0.0.1:3000/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{console.log(r.statusCode+' '+d);process.exit(0)})}).on('error',e=>{console.log('000 '+e.message);process.exit(0)})" || true)
            CODE=${BODY%% *}
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "health: $BODY"
          [ "$CODE" = "200" ] || { echo "SMOKE FAIL: /health=$CODE" >&2; docker logs backend | tail -50; exit 1; }
          echo "$BODY" | grep -q '"status":"ok"' || { echo "SMOKE FAIL: status" >&2; exit 1; }
          echo "$BODY" | grep -q '"redis":"PONG"' || { echo "SMOKE FAIL: redis" >&2; exit 1; }

          # 4) no crash signatures. NOTE: with no PostgreSQL in the smoke
          #    network the app intentionally logs "(non-fatal)" PG lines —
          #    those are expected here; FATAL/uncaught are not.
          bad=$(docker logs backend 2>&1 | grep -cE 'FATAL|[Uu]ncaught' || true)
          echo "crash-signature lines: $bad"
          [ "$bad" -eq 0 ] || { echo "SMOKE FAIL: crash signatures in logs" >&2; exit 1; }

          # 5) container must still be running after the probes
          [ -n "$(docker ps -q --filter name=^backend$)" ] || { echo "SMOKE FAIL: container exited" >&2; exit 1; }
          echo "SMOKE OK"

      - name: Teardown smoke
        if: always()
        run: |
          docker rm -f backend redis >/dev/null 2>&1 || true
          docker network rm be-smoke >/dev/null 2>&1 || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Stage 43: GITHUB_TOKEN is denied write on the pre-existing package
          # (permission_denied: write_package), so publish with the same
          # PAT pattern the gpu-hub workflow uses. Falls back to GITHUB_TOKEN
          # if the secret is absent — least privilege when package permissions
          # are granted to Actions directly.
          password: ${{ secrets.GHCR_IMAGE_PAT || github.token }}

      - name: Push immutable tags (refuse to overwrite existing tags)
        run: |
          set -euo pipefail
          flat() { printf '%s' "$1" | tr '\n' ' ' | cut -c1-3000; }
          # fail-closed: tags are immutable — never re-point an existing tag
          for T in "${{ steps.src.outputs.tag }}" "${{ steps.src.outputs.commit }}"; do
            if docker manifest inspect "${REGISTRY}/${IMAGE_NAME}:${T}" >/dev/null 2>&1; then
              echo "::error::tag ${T} already exists in ${REGISTRY}/${IMAGE_NAME} — refusing to overwrite"
              exit 1
            fi
            echo "tag ${T}: not present, ok to push"
          done
          out=$(docker push "${REGISTRY}/${IMAGE_NAME}:${{ steps.src.outputs.tag }}" 2>&1) \
            || { echo "$out"; echo "::error::push ${{ steps.src.outputs.tag }} failed: $(flat "$out")"; exit 1; }
          echo "$out"
          out=$(docker push "${REGISTRY}/${IMAGE_NAME}:${{ steps.src.outputs.commit }}" 2>&1) \
            || { echo "$out"; echo "::error::push full-sha tag failed: $(flat "$out")"; exit 1; }
          echo "$out"

      - name: Record digest
        run: |
          set -euo pipefail
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.src.outputs.tag }}" 2>/dev/null || echo "N/A")
          {
            echo "## Backend GHCR Release Digest"
            echo '```'
            echo "Image:   ${REGISTRY}/${IMAGE_NAME}:${{ steps.src.outputs.tag }}"
            echo "Image:   ${REGISTRY}/${IMAGE_NAME}:${{ steps.src.outputs.commit }}"
            echo "Digest:  $DIGEST"
            echo "Commit:  ${{ steps.src.outputs.commit }}"
            echo '```'
            echo "**REMEMBER:** record this digest in the cutover audit before consuming."
          } >> "$GITHUB_STEP_SUMMARY"
