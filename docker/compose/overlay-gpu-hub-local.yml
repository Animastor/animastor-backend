# ============================================================
# GPU Hub local development overlay (Phase 10T)
# ============================================================
# Use for local development without GPU_HUB_IMAGE.
# Adds bind mounts from local checkouts for artifact delivery.
#
# Usage:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker/compose/overlay-gpu-hub-local.yml \
#     up -d gpu-hub
#
# This overlay adds the artifact mounts that were removed from
# the base compose in Phase 10T (bake-in). Production uses the
# GHCR image with baked-in artifacts instead, so this file is
# local development only.
#
# WHY EVERY ARTIFACT IS MOUNTED ON BOTH PATHS
#
# The hub resolves artifacts with resolveArtifactDir (gpu-hub.js):
#   config override (strict) > LIVE MOUNT > baked-in /app/artifacts/<name> > frozen 404
# A mounted local source therefore always wins — mounted local files are
# never silently shadowed by baked-in artifacts.
#
# Every group is additionally mounted over its baked-in path
# (/app/artifacts/<name>) as defense in depth: an image that predates the
# precedence fix would otherwise keep serving its stale baked copy
# (measured: mounted worker 2.1.1 served as baked 2.1.0, mounted installer
# 0.1.0 served as baked 1.3.0). With the baked path also mounted, even an
# unfixed image can never serve stale CONTENT.
#
# INSTALLER VERSION: no nested file mount
# ---------------------------------------
# The installer version lives in packages/animastor-installer/package.json.
# It used to be bind-mounted onto /app/installer-src/package.json — nested
# INSIDE the read-only installer-src dir mount — which runc rejects
# ("create mountpoint ...: read-only file system") and the container failed
# to start at all. Fixed by mounting the package ROOT beside it:
#   /app/installer-pkg  (read by the hub as INSTALLER_PKG_DIR default)
# On an unfixed image that ignores /app/installer-pkg, installer-src has no
# package.json once its baked path is shadowed above → /installer answers
# the explicit installer_unavailable 404 instead of silently serving the
# stale baked-in 1.3.0. The installer routes require a hub image that
# contains the fixed resolver (the fixed local/standalone build).
#
# Mount TARGETS (/app/...) are frozen (DEPLOYMENT.md §1); only sources are
# local paths. Override the worker source checkout with
# WORKER_BUNDLE_SRC=/path/to/animastor-worker/packages/animastor-worker/worker

services:
  gpu-hub:
    volumes:
      # Worker bundle source. Since the split the worker lives in its own
      # repository (github.com/Animastor/animastor-worker) and is no longer
      # vendored here, so the source is a path into a checkout of that repo.
      # Default assumes a sibling checkout next to this one; override with
      # WORKER_BUNDLE_SRC=/path/to/animastor-worker/packages/animastor-worker/worker
      - ${WORKER_BUNDLE_SRC:-../animastor-worker/packages/animastor-worker/worker}:/app/worker-bundle:ro
      - ${WORKER_BUNDLE_SRC:-../animastor-worker/packages/animastor-worker/worker}:/app/artifacts/worker-bundle:ro

      # Baseline workflows (frozen target + baked-in path).
      - ./backend/ai/workflows:/app/workflows:ro
      - ./backend/ai/workflows:/app/artifacts/workflows:ro

      # Installer extraction source (frozen target + baked-in path).
      # Directory mounts only — never mount a file inside these (runc
      # cannot create a mountpoint in a read-only dir mount).
      - ./packages/animastor-installer/src/installer:/app/installer-src:ro
      - ./packages/animastor-installer/src/installer:/app/artifacts/installer-src:ro

      # Canonical installer version source (package root). Replaces the
      # removed nested mount of package.json inside /app/installer-src;
      # the hub reads INSTALLER_PKG_DIR (default /app/installer-pkg).
      - ./packages/animastor-installer:/app/installer-pkg:ro

      # Install manifests (frozen target + baked-in path).
      - ./packages/animastor-installer/ai/install-manifests:/app/install-manifests:ro
      - ./packages/animastor-installer/ai/install-manifests:/app/artifacts/install-manifests:ro
